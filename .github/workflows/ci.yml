---
# CI GitHub Actions - debian-server-blueprint
# Job:
#   lint   -> ansible-lint (profile configured in .ansible-lint)
#   syntax -> ansible-playbook --syntax-check for playbook and inventory
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Ansible and ansible-lint
        run: pip install -r requirements-dev.txt
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Run ansible-lint
        run: ansible-lint site.yml

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Ansible and application test dependencies
        run: pip install -r requirements-dev.txt -r requirements-test.txt
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Check playbook and inventory syntax
        run: ansible-playbook --syntax-check -i inventory/hosts.example site.yml
      - name: Safety regression tests
        run: ansible-playbook -i localhost, -c local tests/safety.yml
      - name: Agent Hub least-privilege defaults
        run: ansible-playbook -i localhost, -c local tests/agent_hub_safety.yml
      - name: Install browser for UI regression tests
        run: python -m playwright install --with-deps chromium
      - name: Application and wrapper regression tests
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          ./scripts/check-source.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --no-banner --redact
