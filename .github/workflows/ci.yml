---
# CI GitHub Actions - debian-server-blueprint
# Job:
#   lint   -> ansible-lint (profilo configurato in .ansible-lint)
#   syntax -> ansible-playbook --syntax-check sul playbook e sull'inventario
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa Ansible e ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.18" ansible-lint
      - name: Installa le collection
        run: ansible-galaxy collection install -r requirements.yml
      - name: Esegue ansible-lint
        run: ansible-lint site.yml

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa Ansible
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.18"
      - name: Installa le collection
        run: ansible-galaxy collection install -r requirements.yml
      - name: Syntax check del playbook e dell'inventario
        run: ansible-playbook --syntax-check -i inventory/hosts.example site.yml
