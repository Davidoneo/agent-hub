<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#11131a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent Hub">
<meta name="agent-hub-asset-version" content="__ASSET_VERSION__">
<title>Agent Hub</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/agent-hub.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/vendor/xterm.css?v=__ASSET_VERSION__">
<link rel="stylesheet" href="/static/style.css?v=__ASSET_VERSION__">
</head>
<body>
<div id="app-chrome">
<header>
  <a class="brand" href="#/" aria-label="Agent Hub · Dashboard">Agent&nbsp;Hub</a>
  <nav id="nav" aria-label="Navigazione principale">
    <a href="#/"><span class="dashboard-wide">Dashboard</span><span class="dashboard-short">Home</span> <span id="nav-notice" aria-label="nuovi aggiornamenti"></span></a>
    <a href="#/projects">Progetti</a>
    <a href="#/backlog">Backlog</a>
    <a href="#/new"><span class="wide-label">Nuova sessione</span><span class="short-label">Nuova</span></a>
  </nav>
  <div class="header-right">
    <details class="settings-menu" id="settings-menu">
      <summary>Impostazioni <span id="settings-attention-count" aria-label="avvisi da leggere"></span></summary>
      <div class="settings-panel">
        <button class="settings-item" id="attention-toggle" style="display:none" title="Mostra gli avvisi recenti">Avvisi <span id="attention-toggle-count"></span></button>
        <a class="settings-item" href="#/accounts">Accounts</a>
        <a class="settings-item" href="#/status">Stato del sistema</a>
        <div class="settings-divider"></div>
        <button class="settings-item" id="push-toggle" style="display:none" title="Attiva le notifiche push di Agent Hub">Notifiche: off</button>
        <button class="settings-item" id="usage-toggle" title="Mostra o nasconde il pannello del consumo">Consumo: visibile</button>
        <button class="settings-item" id="help-toggle" title="Mostra o nasconde le spiegazioni">Aiuti: nascosti</button>
        <button class="settings-item" id="theme-toggle" title="Tema chiaro / scuro / automatico">Tema: auto</button>
        <span class="who" id="who"></span>
      </div>
    </details>
  </div>
</header>
</div>
<!-- Gli avvisi non occupano piu' spazio nella pagina: scendono dall'alto in
     sovraimpressione, si ritirano da soli e si riaprono da Impostazioni o dal
     contatore accanto a Dashboard. -->
<div id="notice-stack">
  <div id="attention" aria-live="polite"></div>
  <div id="toast" role="status"></div>
</div>
<div id="banner"></div>
<div id="layout">
  <main id="view"><p class="muted">Caricamento…</p></main>
  <aside id="side"><div id="usage-panel"></div></aside>
</div>


<script src="/static/vendor/xterm.js?v=__ASSET_VERSION__"></script>
<script src="/static/vendor/addon-fit.js?v=__ASSET_VERSION__"></script>
<script src="/static/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
