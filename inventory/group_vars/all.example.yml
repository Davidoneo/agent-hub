# ============================================================
# group_vars/all.example.yml - Example variables (SAFE).
#
# Copy this file to `inventory/group_vars/all.yml` and
# customize. The defaults below are all "safe":
# - actions that could break SSH/networking (firewall and
#   ssh_hardening) are DISABLED;
# - enabling them ALWAYS requires two variables: the
#   enabling one AND the confirmation one (see below).
#
# No real data or secrets: keys/authkeys must be provided at
# runtime (extra-vars, vault, or environment), never in the repository.
# ============================================================

# ------------------------------------------------------------
# profile: laptop or server
# ------------------------------------------------------------
blueprint_profile: laptop

# ------------------------------------------------------------
# common
# ------------------------------------------------------------
# Base packages installed (expandable list).
common_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - htop
  - jq
  - tmux
  - unzip
  - vim

common_apt_update_cache: true   # refresh the apt cache before installing
common_apt_autoremove: false    # remove orphan packages
common_manage_timezone: false   # true to change the timezone
common_timezone: "Etc/UTC"
common_manage_locale: false     # true to generate the given locale
common_locale: "C.UTF-8"
common_hostname: ""             # hostname to set (empty = leave as-is)

# OPT-IN: automatic security updates
common_unattended_upgrades: false
common_unattended_upgrades_reboot: false
common_unattended_upgrades_auto_reboot_time: "02:00"

# ------------------------------------------------------------
# docker
# ------------------------------------------------------------
docker_install: false           # opt-in: install Docker Engine from the official repo
docker_repo_channel: stable
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_users: []                # users to add to the `docker` group
docker_daemon_config: {}        # dict -> generates /etc/docker/daemon.json (empty = no file)

# ------------------------------------------------------------
# SSH access from trusted machines - STRICT OPT-IN
# ------------------------------------------------------------
ssh_access_enabled: false
ssh_access_user: ""              # user already existing on the target
ssh_access_install_server: true  # install/start openssh-server if enabled
ssh_access_public_keys: []       # ed25519/FIDO PUBLIC keys ONLY
ssh_access_exclusive: false      # true removes keys not listed

# ------------------------------------------------------------
# firewall (ufw) - STRICT OPT-IN
# ------------------------------------------------------------
# Enabling requires BOTH:
#   firewall_enabled: true
#   firewall_confirm: true
firewall_enabled: false
firewall_confirm: false
firewall_allow_ssh_from_anywhere: false
firewall_ssh_port: 22
firewall_ssh_sources: []        # trusted CIDRs, e.g. ["192.0.2.0/24"]
firewall_allow_tailscale_ssh: false
firewall_allow_ports: []        # extra incoming ports, format "port/proto"
                                # e.g. ["2375/tcp", "8080/tcp"]
firewall_default_incoming: deny
firewall_default_outgoing: allow

# ------------------------------------------------------------
# ssh_hardening - STRICT OPT-IN
# ------------------------------------------------------------
# Enabling requires BOTH:
#   ssh_hardening_enabled: true
#   ssh_hardening_confirm: true
ssh_hardening_enabled: false
ssh_hardening_confirm: false
ssh_hardening_admin_user: "{{ ssh_access_user }}"
ssh_hardening_port: 22
ssh_hardening_permit_root_login: "no"
ssh_hardening_password_auth: false
ssh_hardening_pubkey_auth: true
ssh_hardening_empty_passwords: false
ssh_hardening_max_auth_tries: 3
ssh_hardening_login_grace_time: 30
ssh_hardening_x11_forwarding: false
ssh_hardening_allow_agent_forwarding: false
ssh_hardening_allow_tcp_forwarding: "no"
ssh_hardening_client_alive_interval: 300
ssh_hardening_client_alive_count_max: 3
ssh_hardening_allow_users: []
# IMPORTANT: with ssh_hardening_password_auth=false the variable
# ssh_hardening_allow_users MUST list the enabled users,
# to avoid locking yourself out of the machine.
ssh_hardening_service_action: reloaded   # "reloaded" (safe) or "restarted"

# ------------------------------------------------------------
# tailscale - base install; manual authentication
# ------------------------------------------------------------
tailscale_install: false

# ------------------------------------------------------------
# Agent Hub - private web UI, STRICT OPT-IN
# ------------------------------------------------------------
agent_hub_install: false
agent_hub_origin: ""                 # e.g. https://host.tailnet.ts.net
agent_hub_allowed_users: []          # exact Tailscale login identities
agent_hub_socket: /run/agent-hub/agent-hub.sock
agent_hub_manage_tailscale_serve: true

# Full host administration requires BOTH flags. Keep false unless SERVER
# sessions are intentionally allowed to become root.
agent_hub_server_admin: false
agent_hub_server_admin_confirm: false

# Root-owned mappings for unattended services needing one deploy key.
# Keep instance-specific profiles in private inventory.
agent_hub_service_deploy_profiles: {}
