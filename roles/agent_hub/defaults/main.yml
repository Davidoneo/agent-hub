---
# Role: agent_hub - persistent agent sessions behind a private web UI
# Documentation in roles/agent_hub/README.md

# Opt-in, like every role that installs a long-running service.
agent_hub_install: false

# Canonical application sources live at the repository root. Override this
# only when embedding the role in a different playbook layout.
agent_hub_source_root: "{{ playbook_dir }}"

# Unix accounts. The service account owns the web process; the two agent
# accounts run the agent sessions and are deliberately separated so that a
# project agent cannot reach host privileges.
agent_hub_service_user: agenthub
agent_hub_project_user: devagent
agent_hub_server_user: hostagent
agent_hub_agent_group: agentprojects

# Private Unix socket consumed by Tailscale Serve. systemd owns the listener
# and passes its file descriptor to Uvicorn, preserving mode 0600 even though
# Uvicorn's direct --uds mode would chmod the socket to 0666.
agent_hub_socket: /run/agent-hub/agent-hub.sock

# Identity check. The reverse proxy (Tailscale Serve) injects the
# Tailscale-User-Login header; only these logins are accepted.
agent_hub_allowed_users: []
agent_hub_require_tailscale: true
agent_hub_manage_tailscale_serve: true

# Expected HTTPS origin for the CSRF and WebSocket checks. Without it the
# browser session cannot be validated, so the role refuses to run.
agent_hub_origin: ""

# Paths.
agent_hub_root: /opt/agent-hub
agent_hub_libexec: /usr/local/libexec/agent-hub
agent_hub_config_dir: /etc/agent-hub
agent_hub_state_dir: /var/lib/agent-hub
agent_hub_workspace: /srv/agent-workspace

# Nightly updates keep the globally installed Codex/OpenCode binaries and the
# per-user Claude Code installations current. A Codex PROJECT audit is opened
# after every nightly update cycle (duplicate reruns on the same day are skipped).
agent_hub_harness_updates_enabled: true
agent_hub_harness_update_calendar: "*-*-* 03:20:00"
agent_hub_harness_audit_project: agent-hub
agent_hub_harness_audit_model: gpt-5.6-sol
agent_hub_harness_audit_effort: high

# Deterministic controller. Thresholds are re-read from controller.json at
# every access, so tuning one needs no service restart.
#
# `patterns` is how the controller learns that a live session is blocked rather
# than working. They are matched against the *visible* pane, never the PTY
# scrollback, so they must be text the TUI keeps on screen for as long as the
# obstacle lasts. Without them USAGE_LIMIT can never be reached: the session
# stays "at work" for hours, its wait is billed as work time, and no
# notification is ever raised. AUTH_REQUIRED ships empty on purpose - the login
# screens were not verified for every harness, and a wrong pattern would freeze
# a healthy session into a state nobody asked for.
agent_hub_controller_stall_seconds: 900
agent_hub_controller_sweep_seconds: 30
agent_hub_controller_nudge_seconds: 240
agent_hub_controller_work_gap_seconds: 120
# Automatic resume of a session parked on a usage limit: retry interval (also
# the grace left to the harness's own auto-resume after the announced reset),
# the wait used when no window announces a reset instant, and a closed number
# of attempts. Set the attempts to 0 to disable the resume entirely.
agent_hub_controller_resume_retry_seconds: 900
agent_hub_controller_resume_blind_seconds: 3600
agent_hub_controller_resume_max_attempts: 8
#
# Every pattern is anchored to the shape the TUI actually draws - a line start,
# or a literal that includes the command the footer offers. A looser wording
# would match an agent that merely writes the sentence in its own output, and
# that is not a hypothetical: the very session that introduced these patterns
# flagged itself the moment it printed them. Screen matching makes such a false
# positive self-healing (it goes away when the text scrolls off) but the
# patterns still have to earn their specificity.
#
# Known gap, accepted: Claude's /rate-limit-options menu, shown instead of the
# automatic wait when the reset is more than 24h out, is not recognised - its
# rows are too close to ordinary prose to match safely.
agent_hub_controller_patterns:
  AUTH_REQUIRED: []
  USAGE_LIMIT:
    # Codex: the error banner carries the TUI's own bullet, and a parked goal
    # keeps its state in the footer, next to the command that resumes it.
    - "(?m)^\\s*■ You've hit your usage limit"
    - "(?m)^\\s*Usage limit reached\\. You've reached your usage limit"
    - "Goal hit usage limits \\(/goal resume\\)"
    # Claude Code: the status line of a wait armed by autoContinueAtUsageLimit.
    - "(?m)^\\s*Continuing automatically when your limit resets"

# The SERVER account is the dedicated host administrator. PROJECT remains
# unprivileged and reaches GitHub only through per-project deploy keys.
agent_hub_server_admin: false
agent_hub_server_admin_confirm: false

# Optional root-owned profiles for systemd services that need one project's
# deploy key. Every profile requires caller, unit and project fields.
agent_hub_service_deploy_profiles: {}

# Audit use of the account-wide GitHub CLI and every `git push`. This never
# stores credentials; it records command metadata in a group-writable log.
agent_hub_github_audit_enabled: false
agent_hub_github_log_dir: /var/log/agent-hub

# Telegram notifier. Disabled by default: it is the only component that
# talks to the internet. Put the token in a vault, never in group_vars.
agent_hub_telegram_enabled: false
agent_hub_telegram_token: ""
agent_hub_telegram_chat_ids: []

# Bot separato, dedicato esclusivamente alla raccolta di idee testuali e vocali.
# Il servizio può essere predisposto senza token e resta inerte finché
# /etc/agent-hub/backlog-telegram.env non viene completato dall'amministratore.
agent_hub_backlog_telegram_enabled: false

# Claude Code does not expose a refresh-only command. When its renewable OAuth
# access token expires, the usage reader may perform one safe-mode startup per
# Unix account every 20 hours and stop it before any model turn is sent.
agent_hub_claude_auto_refresh: true

# Standards-based Web Push for installed Agent Hub PWAs. The private VAPID key
# is generated locally on first install and never belongs in inventory/Git.
agent_hub_webpush_enabled: false
agent_hub_webpush_private_key: /etc/agent-hub/webpush-private.pem
# Empty uses agent_hub_origin at runtime; override with a public mailto: or URL.
agent_hub_webpush_subject: ""
