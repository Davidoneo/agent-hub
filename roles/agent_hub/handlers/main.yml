---
# Role: agent_hub - handlers
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart agent-hub
  ansible.builtin.systemd:
    name: agent-hub
    state: restarted

- name: Restart agent-hub-telegram
  ansible.builtin.systemd:
    name: agent-hub-telegram
    state: restarted

- name: Reload agent-hub-loopback-guard
  ansible.builtin.systemd:
    name: agent-hub-loopback-guard.service
    state: reloaded
    daemon_reload: true
  when: agent_hub_loopback_guard_enabled | bool
