---
# Role: agent_hub - handlers
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart agent-hub socket
  ansible.builtin.systemd:
    name: agent-hub.socket
    state: restarted

- name: Restart agent-hub
  ansible.builtin.systemd:
    name: agent-hub
    state: restarted

- name: Restart agent-hub-telegram
  ansible.builtin.systemd:
    name: agent-hub-telegram
    state: restarted

- name: Restart agent-hub-backlog-telegram
  ansible.builtin.systemd:
    name: agent-hub-backlog-telegram
    state: restarted
