---
# Ruolo: common - baseline di base per Debian 13 / Ubuntu
# Documentation in roles/common/README.md

# Profilo effettivo; blueprint_profile è la variabile pubblica globale.
common_profile: "{{ blueprint_profile | default('laptop') }}"

# --- pacchetti base ---
common_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - htop
  - jq
  - tmux
  - unzip
  - vim

common_profile_packages:
  laptop:
    - openssh-client
    - rsync
  server:
    - openssh-client
    - rsync
    - smartmontools

common_packages: >-
  {{ common_base_packages + common_profile_packages[common_profile] }}

common_apt_update_cache: true
common_apt_autoremove: false

# --- sistema ---
common_manage_timezone: false
common_timezone: "Etc/UTC"
common_manage_locale: false
common_locale: "C.UTF-8"
common_hostname: ""

# --- OPT-IN: aggiornamenti automatici ---
common_unattended_upgrades: false
common_unattended_upgrades_reboot: false
common_unattended_upgrades_auto_reboot_time: "02:00"
