---
# Ruolo: common - task principali
# Supporto dichiarato: Debian 13+ e Ubuntu 24.04+

# ------------------------------------------------------------
# Preflight: verifica il supporto dichiarato della distro.
# Se un utente usa il repository su una distro diversa deve
# adattare i ruoli (vedi README -> "Fork e adattamento distro").
# ------------------------------------------------------------
- name: Preflight | profilo supportato
  ansible.builtin.assert:
    that:
      - common_profile in ["laptop", "server"]
    fail_msg: >-
      Profilo non valido: {{ common_profile }}. Usa laptop o server.

# ------------------------------------------------------------
# Repository e pacchetti
# ------------------------------------------------------------
- name: Aggiorna la cache dei pacchetti
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: common_apt_update_cache | bool

- name: Installa pacchetti di base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Rimuove pacchetti orfani (autoremove)
  ansible.builtin.apt:
    autoremove: true
  when: common_apt_autoremove | bool

# ------------------------------------------------------------
# Sistema di base
# ------------------------------------------------------------
- name: Imposta il fuso orario
  community.general.timezone:
    name: "{{ common_timezone }}"
  when: common_manage_timezone | bool

- name: Configura il locale di sistema
  community.general.locale_gen:
    name: "{{ common_locale }}"
    state: present
  when: common_manage_locale | bool

- name: Imposta l'hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  when: common_hostname | length > 0

# ------------------------------------------------------------
# OPT-IN: aggiornamenti di sicurezza automatici
# ------------------------------------------------------------
- name: Unattended upgrades | opzione opt-in attiva
  ansible.builtin.debug:
    msg: >-
      common_unattended_upgrades=true: verranno installati
      automaticamente gli aggiornamenti di sicurezza. Azione opt-in.
  when: common_unattended_upgrades | bool

- name: Installa unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: common_unattended_upgrades | bool

- name: Template configurazione unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  when: common_unattended_upgrades | bool
