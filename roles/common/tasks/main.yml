---
# Role: common - main tasks
# Declared support: Debian 13+ and Ubuntu 24.04+

# ------------------------------------------------------------
# Preflight: verify declared distro support.
# If a user runs the repository on a different distro they must
# adapt the roles (see README -> "Forking and adapting distros").
# ------------------------------------------------------------
- name: Preflight | supported profile
  ansible.builtin.assert:
    that:
      - common_profile in ["laptop", "server"]
    fail_msg: >-
      Invalid profile: {{ common_profile }}. Use laptop or server.

# ------------------------------------------------------------
# Repositories and packages
# ------------------------------------------------------------
- name: Refresh the package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: common_apt_update_cache | bool

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Remove orphan packages (autoremove)
  ansible.builtin.apt:
    autoremove: true
  when: common_apt_autoremove | bool

# ------------------------------------------------------------
# Base system
# ------------------------------------------------------------
- name: Set the timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  when: common_manage_timezone | bool

- name: Configure the system locale
  community.general.locale_gen:
    name: "{{ common_locale }}"
    state: present
  when: common_manage_locale | bool

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  when: common_hostname | length > 0

# ------------------------------------------------------------
# OPT-IN: automatic security updates
# ------------------------------------------------------------
- name: Unattended upgrades | opt-in option active
  ansible.builtin.debug:
    msg: >-
      common_unattended_upgrades=true: security updates will be installed
      automatically. Opt-in action.
  when: common_unattended_upgrades | bool

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: common_unattended_upgrades | bool

- name: Template unattended-upgrades configuration
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  when: common_unattended_upgrades | bool
