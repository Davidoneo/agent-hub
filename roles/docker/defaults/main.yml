---
# Role: docker - install Docker Engine from the official repository
# Documentation in roles/docker/README.md

docker_install: false
docker_repo_channel: stable
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Users to add to the `docker` group (the group is created by the package).
docker_users: []

# Daemon configuration: dict -> /etc/docker/daemon.json.
# Empty = does not manage the file (left as-is on the target).
docker_daemon_config: {}

# Path of the Docker repository GPG keyring.
docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
