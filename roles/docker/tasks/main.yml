---
# Role: docker - main tasks
# Installation from the official repository (download.docker.com).
# NOTE: no `curl | sh`: the GPG key is downloaded via get_url.

# ------------------------------------------------------------
# Preflight
# ------------------------------------------------------------
- name: Preflight | supported operating system (Docker)
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.distribution in ["Debian", "Ubuntu"]
    fail_msg: >-
      Role 'docker' supports only Debian and Ubuntu.
      Detected: {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}.

- name: Preflight | installation not requested
  ansible.builtin.debug:
    msg: "docker_install=false: the role changes nothing."
  when: not docker_install | bool

# ------------------------------------------------------------
# Official Docker repository (apt)
# ------------------------------------------------------------
- name: Install repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
  when: docker_install | bool

- name: Create the keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: docker_install | bool

- name: Download the official Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ docker_distro_slug }}/gpg"
    dest: "{{ docker_keyring_path }}"
    mode: "0644"
  when: docker_install | bool

- name: Check for the presence of the Docker key
  ansible.builtin.stat:
    path: "{{ docker_keyring_path }}"
  register: docker_keyring_file
  when: docker_install | bool

- name: Verify the Docker key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ docker_keyring_path }}"
  register: docker_key_inspection
  changed_when: false
  check_mode: false
  when:
    - docker_install | bool
    - docker_keyring_file.stat.exists | bool

- name: Reject an unexpected Docker key
  ansible.builtin.assert:
    that:
      - docker_key_fingerprint in docker_key_inspection.stdout
    fail_msg: >-
      Unexpected Docker key fingerprint: repository not configured.
  when:
    - docker_install | bool
    - docker_keyring_file.stat.exists | bool

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ docker_distro_slug }}"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: ["{{ docker_repo_channel }}"]
    signed_by: "{{ docker_keyring_path }}"
    state: present
  when: docker_install | bool

# ------------------------------------------------------------
# Package installation
# ------------------------------------------------------------
- name: Install the Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  when: docker_install | bool

- name: Start and enable the Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: docker_install | bool

# ------------------------------------------------------------
# Users in the docker group (OPT-IN: empty list by default)
# ------------------------------------------------------------
- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when:
    - docker_install | bool
    - docker_users | length > 0

# ------------------------------------------------------------
# Daemon configuration (OPT-IN via docker_daemon_config)
# ------------------------------------------------------------
- name: Generate /etc/docker/daemon.json
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  when:
    - docker_install | bool
    - docker_daemon_config | length > 0
  notify: Restart Docker
