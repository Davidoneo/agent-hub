---
# Role: firewall (ufw) - STRICT OPT-IN
# Documentation in roles/firewall/README.md

# Enabling ALWAYS requires both variables:
#   firewall_enabled: true
#   firewall_confirm: true
# This prevents accidentally breaking SSH/networking.
firewall_enabled: false
firewall_confirm: false

# SSH access: no source is implicitly authorized.
firewall_allow_ssh_from_anywhere: false
firewall_ssh_port: 22
firewall_ssh_sources: []
firewall_allow_tailscale_ssh: false

# Extra incoming ports, format "port/proto", e.g. ["8080/tcp"].
firewall_allow_ports: []

# Default policies.
firewall_default_incoming: deny
firewall_default_outgoing: allow
