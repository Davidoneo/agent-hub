---
- name: Preflight | guaranteed SSH access
  ansible.builtin.assert:
    that:
      - firewall_ssh_port | int > 0
      - firewall_ssh_port | int < 65536
      - >-
        firewall_allow_ssh_from_anywhere | bool or
        firewall_ssh_sources | length > 0 or
        firewall_allow_tailscale_ssh | bool or
        ((firewall_ssh_port | string) ~ '/tcp') in firewall_allow_ports
    fail_msg: >-
      Before enabling UFW configure at least one SSH path: trusted CIDRs,
      the Tailscale interface, explicit access from anywhere, or the port
      "{{ firewall_ssh_port }}/tcp" among the extra ports.
