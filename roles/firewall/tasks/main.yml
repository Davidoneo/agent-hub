---
# Role: firewall (ufw) - main tasks
# STRICT OPT-IN: without firewall_enabled=true the role touches nothing.

# ------------------------------------------------------------
# Preflight
# ------------------------------------------------------------
- name: Firewall | skip - disabled
  ansible.builtin.debug:
    msg: >-
      Role 'firewall' NOT active: set firewall_enabled=true and
      firewall_confirm=true to enable ufw.
  when: not firewall_enabled | bool

- name: Preflight | mandatory confirmation
  ansible.builtin.assert:
    that:
      - firewall_confirm | bool
    fail_msg: >-
      Enabling the firewall also requires firewall_confirm=true.
      A misconfigured firewall can break SSH and networking:
      make sure you have an out-of-band access channel (console/IPMI).
  when: firewall_enabled | bool

- name: Preflight | verify an SSH path
  ansible.builtin.include_tasks: check_ssh_path.yml
  when: firewall_enabled | bool

- name: Preflight | extra port format
  ansible.builtin.assert:
    that:
      - item is match('^[0-9]{1,5}/(tcp|udp)$')
      - item.split('/')[0] | int > 0
      - item.split('/')[0] | int < 65536
    fail_msg: "Invalid port: {{ item }}. Use the format 443/tcp or 53/udp."
  loop: "{{ firewall_allow_ports }}"
  when: firewall_enabled | bool

- name: Preflight | supported distro
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ["Debian", "Ubuntu"]
    fail_msg: >-
      Role 'firewall' supports only Debian and Ubuntu (ufw).
      Detected: {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}.

# ------------------------------------------------------------
# Application (only if firewall_enabled)
# ------------------------------------------------------------
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
  when: firewall_enabled | bool

- name: Default policy - incoming
  community.general.ufw:
    direction: incoming
    policy: "{{ firewall_default_incoming }}"
  when: firewall_enabled | bool

- name: Default policy - outgoing
  community.general.ufw:
    direction: outgoing
    policy: "{{ firewall_default_outgoing }}"
  when: firewall_enabled | bool

- name: Allow SSH from any source
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port }}"
    proto: tcp
  when:
    - firewall_enabled | bool
    - firewall_allow_ssh_from_anywhere | bool

- name: Allow SSH only from trusted CIDRs
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "{{ firewall_ssh_port }}"
    proto: tcp
  loop: "{{ firewall_ssh_sources }}"
  when: firewall_enabled | bool

- name: Allow SSH via the Tailscale interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0
    port: "{{ firewall_ssh_port }}"
    proto: tcp
  when:
    - firewall_enabled | bool
    - firewall_allow_tailscale_ssh | bool

- name: Allow extra incoming ports
  community.general.ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] | default('tcp') }}"
  loop: "{{ firewall_allow_ports }}"
  when: firewall_enabled | bool

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: firewall_enabled | bool

- name: Enable the ufw service at boot
  ansible.builtin.systemd:
    name: ufw
    enabled: true
    state: started
  when: firewall_enabled | bool
