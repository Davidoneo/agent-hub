---
- name: SSH access | skip - disabled
  ansible.builtin.debug:
    msg: >-
      ssh_access_enabled=false: no key or SSH service is modified.
  when: not ssh_access_enabled | bool

- name: SSH access | validate required configuration
  ansible.builtin.assert:
    that:
      - ssh_access_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - ssh_access_public_keys | length > 0
      - >-
        ssh_access_public_keys |
        reject('match', '^(ssh-ed25519|sk-ssh-ed25519@openssh.com) [A-Za-z0-9+/]+={0,3}( .*)?$') |
        list | length == 0
    fail_msg: >-
      Specify an existing user and at least one valid ed25519/FIDO public key.
      Never put private keys in the repository or in variables.
  when: ssh_access_enabled | bool
  no_log: true

- name: SSH access | read the target user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ssh_access_user }}"
    fail_key: false
  when: ssh_access_enabled | bool

- name: SSH access | require an existing target user
  ansible.builtin.assert:
    that:
      - ssh_access_user in (ansible_facts.getent_passwd | default({}))
    fail_msg: >-
      User {{ ssh_access_user }} does not exist. Create it explicitly before
      the SSH bootstrap; this role does not create admin accounts.
  when: ssh_access_enabled | bool

- name: SSH access | install OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present
  when:
    - ssh_access_enabled | bool
    - ssh_access_install_server | bool

- name: SSH access | install the trusted public keys
  ansible.posix.authorized_key:
    user: "{{ ssh_access_user }}"
    key: "{{ ssh_access_public_keys | join('\n') }}"
    state: present
    manage_dir: true
    exclusive: "{{ ssh_access_exclusive | bool }}"
  when: ssh_access_enabled | bool
  no_log: true

- name: SSH access | enable the SSH service
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started
  when:
    - ssh_access_enabled | bool
    - ssh_access_install_server | bool
