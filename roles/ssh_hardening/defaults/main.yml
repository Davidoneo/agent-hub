---
# Role: ssh_hardening - STRICT OPT-IN
# Documentation in roles/ssh_hardening/README.md

# Enabling ALWAYS requires both variables:
#   ssh_hardening_enabled: true
#   ssh_hardening_confirm: true
# A wrong SSH configuration can lock you out of the machine.
ssh_hardening_enabled: false
ssh_hardening_confirm: false
ssh_hardening_admin_user: ""

# Generated drop-in in /etc/ssh/sshd_config.d/ (takes precedence over
# sshd_config because Debian/Ubuntu read the Include first).
ssh_hardening_dropin_path: /etc/ssh/sshd_config.d/99-baseline-hardening.conf

ssh_hardening_port: 22
ssh_hardening_permit_root_login: "no"
ssh_hardening_password_auth: false
ssh_hardening_pubkey_auth: true
ssh_hardening_empty_passwords: false
ssh_hardening_max_auth_tries: 3
ssh_hardening_login_grace_time: 30
ssh_hardening_x11_forwarding: false
ssh_hardening_allow_agent_forwarding: false
ssh_hardening_allow_tcp_forwarding: "no"
ssh_hardening_client_alive_interval: 300
ssh_hardening_client_alive_count_max: 3

# Users allowed to log in (AllowUsers).
# With password_auth=false this list MUST be filled in:
# it is the lock-out protection.
ssh_hardening_allow_users: []

# "reloaded" (default, does not interrupt active sessions) or "restarted".
ssh_hardening_service_action: reloaded
