---
# Ruolo: ssh_hardening - task principali
# STRICT OPT-IN: senza ssh_hardening_enabled=true il ruolo non tocca nulla.

# ------------------------------------------------------------
# Preflight
# ------------------------------------------------------------
- name: SSH hardening | skip - disabilitato
  ansible.builtin.debug:
    msg: >-
      Ruolo 'ssh_hardening' NON attivo: imposta ssh_hardening_enabled=true
      e ssh_hardening_confirm=true per applicare la configurazione.
  when: not ssh_hardening_enabled | bool

- name: Preflight | conferma obbligatoria
  ansible.builtin.assert:
    that:
      - ssh_hardening_confirm | bool
      - ssh_hardening_admin_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - ssh_hardening_port | int > 0
      - ssh_hardening_port | int < 65536
      - ssh_hardening_service_action in ["reloaded", "restarted"]
    fail_msg: >-
      Applicare l'hardening SSH richiede ANCHE ssh_hardening_confirm=true.
      Una configurazione errata può impedire l'accesso SSH alla macchina.
  when: ssh_hardening_enabled | bool

- name: Preflight | utenti SSH validi
  ansible.builtin.assert:
    that:
      - >-
        ssh_hardening_allow_users |
        reject('match', '^[a-z_][a-z0-9_-]{0,31}$') |
        list | length == 0
      - >-
        ssh_hardening_password_auth | bool or
        ssh_hardening_admin_user in ssh_hardening_allow_users
    fail_msg: >-
      Con login a password disabilitato, ssh_hardening_allow_users deve
      contenere l'utente amministrativo e soltanto nomi utente validi.
  when: ssh_hardening_enabled | bool

- name: Preflight | legge l'utente amministrativo
  ansible.builtin.getent:
    database: passwd
    key: "{{ ssh_hardening_admin_user }}"
    fail_key: false
  when: ssh_hardening_enabled | bool

- name: Preflight | richiede un utente amministrativo esistente
  ansible.builtin.assert:
    that:
      - ssh_hardening_admin_user in (ansible_facts.getent_passwd | default({}))
    fail_msg: "Utente SSH inesistente: {{ ssh_hardening_admin_user }}."
  when: ssh_hardening_enabled | bool

- name: Preflight | controlla authorized_keys dell'amministratore
  ansible.builtin.stat:
    path: >-
      {{ ansible_facts.getent_passwd[ssh_hardening_admin_user][4] }}/.ssh/authorized_keys
  register: ssh_hardening_authorized_keys
  when:
    - ssh_hardening_enabled | bool
    - not ssh_hardening_password_auth | bool

- name: Preflight | richiede almeno una chiave autorizzata reale
  ansible.builtin.assert:
    that:
      - ssh_hardening_authorized_keys.stat.isreg | default(false)
      - ssh_hardening_authorized_keys.stat.size | default(0) | int > 0
    fail_msg: >-
      Non disabilitare la password finché authorized_keys dell'utente
      amministrativo non esiste, non contiene una chiave e non è stata provata.
  when:
    - ssh_hardening_enabled | bool
    - not ssh_hardening_password_auth | bool

- name: Preflight | verifica il percorso SSH nel firewall
  ansible.builtin.include_tasks: check_firewall.yml
  when:
    - ssh_hardening_enabled | bool
    - firewall_enabled | default(false) | bool
  tags: [ssh_hardening, preflight]

# ------------------------------------------------------------
# Applicazione (solo se ssh_hardening_enabled)
# ------------------------------------------------------------
- name: Assicura la directory dei drop-in sshd
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ssh_hardening_enabled | bool

- name: Genera il drop-in di hardening SSH
  ansible.builtin.template:
    src: sshd_baseline.conf.j2
    dest: "{{ ssh_hardening_dropin_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  when: ssh_hardening_enabled | bool
  notify: Ricarica sshd

- name: Valida la configurazione sshd completa (drop-in incluso)
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false
  when: ssh_hardening_enabled | bool
