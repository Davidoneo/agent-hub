---
# Role: ssh_hardening - main tasks
# STRICT OPT-IN: without ssh_hardening_enabled=true the role touches nothing.

# ------------------------------------------------------------
# Preflight
# ------------------------------------------------------------
- name: SSH hardening | skip - disabled
  ansible.builtin.debug:
    msg: >-
      Role 'ssh_hardening' NOT active: set ssh_hardening_enabled=true
      and ssh_hardening_confirm=true to apply the configuration.
  when: not ssh_hardening_enabled | bool

- name: Preflight | mandatory confirmation
  ansible.builtin.assert:
    that:
      - ssh_hardening_confirm | bool
      - ssh_hardening_admin_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - ssh_hardening_port | int > 0
      - ssh_hardening_port | int < 65536
      - ssh_hardening_service_action in ["reloaded", "restarted"]
    fail_msg: >-
      Applying SSH hardening also requires ssh_hardening_confirm=true.
      A misconfigured setup can prevent SSH access to the machine.
  when: ssh_hardening_enabled | bool

- name: Preflight | valid SSH users
  ansible.builtin.assert:
    that:
      - >-
        ssh_hardening_allow_users |
        reject('match', '^[a-z_][a-z0-9_-]{0,31}$') |
        list | length == 0
      - >-
        ssh_hardening_password_auth | bool or
        ssh_hardening_admin_user in ssh_hardening_allow_users
    fail_msg: >-
      With password login disabled, ssh_hardening_allow_users must contain
      the admin user and only valid usernames.
  when: ssh_hardening_enabled | bool

- name: Preflight | read the admin user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ssh_hardening_admin_user }}"
    fail_key: false
  when: ssh_hardening_enabled | bool

- name: Preflight | require an existing admin user
  ansible.builtin.assert:
    that:
      - ssh_hardening_admin_user in (ansible_facts.getent_passwd | default({}))
    fail_msg: "SSH user does not exist: {{ ssh_hardening_admin_user }}."
  when: ssh_hardening_enabled | bool

- name: Preflight | check the admin's authorized_keys
  ansible.builtin.stat:
    path: >-
      {{ ansible_facts.getent_passwd[ssh_hardening_admin_user][4] }}/.ssh/authorized_keys
  register: ssh_hardening_authorized_keys
  when:
    - ssh_hardening_enabled | bool
    - not ssh_hardening_password_auth | bool

- name: Preflight | require at least one real authorized key
  ansible.builtin.assert:
    that:
      - ssh_hardening_authorized_keys.stat.isreg | default(false)
      - ssh_hardening_authorized_keys.stat.size | default(0) | int > 0
    fail_msg: >-
      Do not disable the password until the admin user's authorized_keys
      exists, contains a key, and has been tested.
  when:
    - ssh_hardening_enabled | bool
    - not ssh_hardening_password_auth | bool

- name: Preflight | verify the SSH path in the firewall
  ansible.builtin.include_tasks: check_firewall.yml
  when:
    - ssh_hardening_enabled | bool
    - firewall_enabled | default(false) | bool
  tags: [ssh_hardening, preflight]

# ------------------------------------------------------------
# Application (only if ssh_hardening_enabled)
# ------------------------------------------------------------
- name: Ensure the sshd drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ssh_hardening_enabled | bool

- name: Generate the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_baseline.conf.j2
    dest: "{{ ssh_hardening_dropin_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  when: ssh_hardening_enabled | bool
  notify: Reload sshd

- name: Validate the full sshd configuration (drop-in included)
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false
  when: ssh_hardening_enabled | bool
