---
# Ruolo: tailscale - task principali
# Installazione da repository ufficiale (pkgs.tailscale.com).
# Il ruolo non accetta auth key e non esegue `tailscale up`.

# ------------------------------------------------------------
# Preflight
# ------------------------------------------------------------
- name: Tailscale | skip installazione richiesta
  ansible.builtin.debug:
    msg: "tailscale_install=false: il ruolo non modifica nulla."
  when: not tailscale_install | bool

- name: Preflight | distro supportata
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ["Debian", "Ubuntu"]
    fail_msg: >-
      Ruolo 'tailscale' supporta solo Debian e Ubuntu.
      Rilevato: {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}.

# ------------------------------------------------------------
# Installazione (repository ufficiale)
# ------------------------------------------------------------
- name: Crea directory dei keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: tailscale_install | bool

- name: Installa dipendenze per repository e verifica chiave
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - python3-debian
    state: present
  when: tailscale_install | bool

- name: Scarica la chiave GPG ufficiale di Tailscale
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_distro_slug }}/{{ ansible_facts.distribution_release }}.gpg"
    dest: "{{ tailscale_keyring_path }}"
    mode: "0644"
  when: tailscale_install | bool

- name: Controlla la presenza della chiave Tailscale
  ansible.builtin.stat:
    path: "{{ tailscale_keyring_path }}"
  register: tailscale_keyring_file
  when: tailscale_install | bool

- name: Verifica il fingerprint della chiave Tailscale
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ tailscale_keyring_path }}"
  register: tailscale_key_inspection
  changed_when: false
  check_mode: false
  when:
    - tailscale_install | bool
    - tailscale_keyring_file.stat.exists | bool

- name: Rifiuta una chiave Tailscale inattesa
  ansible.builtin.assert:
    that:
      - tailscale_key_fingerprint in tailscale_key_inspection.stdout
    fail_msg: >-
      Fingerprint della chiave Tailscale inatteso: repository non configurato.
  when:
    - tailscale_install | bool
    - tailscale_keyring_file.stat.exists | bool

- name: Aggiunge il repository apt di Tailscale
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "https://pkgs.tailscale.com/stable/{{ tailscale_distro_slug }}"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [main]
    signed_by: "{{ tailscale_keyring_path }}"
    state: present
  when: tailscale_install | bool

- name: Installa il pacchetto tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
  when: tailscale_install | bool

- name: Avvia e abilita il servizio tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  when: tailscale_install | bool

- name: Indica il passaggio di autenticazione separato
  ansible.builtin.debug:
    msg: >-
      Tailscale installato. Autentica il nodo fuori dal playbook con
      'sudo tailscale up' oppure con la procedura approvata dalla tua rete.
      Non salvare auth key nell'inventory o nella shell history.
  when: tailscale_install | bool
