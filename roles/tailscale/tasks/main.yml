---
# Role: tailscale - main tasks
# Installation from the official repository (pkgs.tailscale.com).
# The role does not accept auth keys and does not run `tailscale up`.

# ------------------------------------------------------------
# Preflight
# ------------------------------------------------------------
- name: Tailscale | installation not requested
  ansible.builtin.debug:
    msg: "tailscale_install=false: the role changes nothing."
  when: not tailscale_install | bool

- name: Preflight | supported distro
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ["Debian", "Ubuntu"]
    fail_msg: >-
      Role 'tailscale' supports only Debian and Ubuntu.
      Detected: {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}.

# ------------------------------------------------------------
# Installation (official repository)
# ------------------------------------------------------------
- name: Create the keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: tailscale_install | bool

- name: Install repository and key verification dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - python3-debian
    state: present
  when: tailscale_install | bool

- name: Download the official Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_distro_slug }}/{{ ansible_facts.distribution_release }}.gpg"
    dest: "{{ tailscale_keyring_path }}"
    mode: "0644"
  when: tailscale_install | bool

- name: Check for the presence of the Tailscale key
  ansible.builtin.stat:
    path: "{{ tailscale_keyring_path }}"
  register: tailscale_keyring_file
  when: tailscale_install | bool

- name: Verify the Tailscale key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ tailscale_keyring_path }}"
  register: tailscale_key_inspection
  changed_when: false
  check_mode: false
  when:
    - tailscale_install | bool
    - tailscale_keyring_file.stat.exists | bool

- name: Reject an unexpected Tailscale key
  ansible.builtin.assert:
    that:
      - tailscale_key_fingerprint in tailscale_key_inspection.stdout
    fail_msg: >-
      Unexpected Tailscale key fingerprint: repository not configured.
  when:
    - tailscale_install | bool
    - tailscale_keyring_file.stat.exists | bool

- name: Add the Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "https://pkgs.tailscale.com/stable/{{ tailscale_distro_slug }}"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [main]
    signed_by: "{{ tailscale_keyring_path }}"
    state: present
  when: tailscale_install | bool

- name: Install the tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: present
  when: tailscale_install | bool

- name: Start and enable the tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  when: tailscale_install | bool

- name: Point out the separate authentication step
  ansible.builtin.debug:
    msg: >-
      Tailscale installed. Authenticate the node outside the playbook with
      'sudo tailscale up' or with the procedure approved by your network.
      Do not store auth keys in the inventory or in shell history.
  when: tailscale_install | bool
