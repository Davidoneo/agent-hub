---
# Role: tailscale - derived variables

# Distribution slug used in the Tailscale repository URLs.
tailscale_distro_slug: "{{ 'debian' if ansible_facts.distribution == 'Debian' else 'ubuntu' }}"

# Path of the Tailscale repository GPG keyring.
tailscale_keyring_path: /etc/apt/keyrings/tailscale.asc
