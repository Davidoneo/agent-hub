---
# ============================================================
# site.yml - Baseline laptop/server per Debian 13 / Ubuntu 24.04+
#
# Uso sicuro:
#   ansible-playbook site.yml --check --diff            # prova a secco
#   ansible-playbook site.yml --tags common             # solo un ruolo
#
# Azioni "pericolose" (firewall, ssh_hardening, tailscale up)
# sono STRETTAMENTE OPT-IN: restano disabilitate finché non
# attivi le variabili relative (vedi group_vars di esempio e README).
# ============================================================

- name: Baseline laptop or server - Debian 13 / Ubuntu
  hosts: all
  gather_facts: true
  become: true
  pre_tasks:
    - name: Preflight | profilo macchina valido
      ansible.builtin.assert:
        that:
          - (blueprint_profile | default('laptop')) in ["laptop", "server"]
        fail_msg: >-
          blueprint_profile deve essere 'laptop' oppure 'server'.
      tags: [always, preflight]

    - name: Preflight | release supportata
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
          - >-
            (ansible_facts.distribution == "Debian" and
             ansible_facts.distribution_major_version | int >= 13) or
            (ansible_facts.distribution == "Ubuntu" and
             ansible_facts.distribution_version is version('24.04', '>='))
        fail_msg: >-
          Supporto iniziale: Debian 13+ e Ubuntu 24.04+. Per altre
          distribuzioni o release crea una fork e adatta package/service/path.
      tags: [always, preflight]
  roles:
    - role: common
      tags: [common, baseline]
    - role: ssh_access
      tags: [ssh_access, ssh, baseline]
    - role: docker
      tags: [docker, baseline]
    - role: tailscale
      tags: [tailscale, baseline]
    - role: ssh_hardening
      tags: [ssh_hardening, ssh, baseline]
    - role: firewall
      tags: [firewall, baseline]
