---
# ============================================================
# site.yml - laptop/server baseline for Debian 13 / Ubuntu 24.04+
#
# Safe usage:
#   ansible-playbook site.yml --check --diff            # dry run
#   ansible-playbook site.yml --tags common             # single role
#
# "Dangerous" actions (firewall, ssh_hardening, tailscale up)
# are STRICTLY OPT-IN: they stay disabled until you activate
# the related variables (see the example group_vars and README).
# ============================================================

- name: Baseline laptop or server - Debian 13 / Ubuntu
  hosts: all
  gather_facts: true
  become: true
  pre_tasks:
    - name: Preflight | valid machine profile
      ansible.builtin.assert:
        that:
          - (blueprint_profile | default('laptop')) in ["laptop", "server"]
        fail_msg: >-
          blueprint_profile must be 'laptop' or 'server'.
      tags: [always, preflight]

    - name: Preflight | supported release
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
          - >-
            (ansible_facts.distribution == "Debian" and
             ansible_facts.distribution_major_version | int >= 13) or
            (ansible_facts.distribution == "Ubuntu" and
             ansible_facts.distribution_version is version('24.04', '>='))
        fail_msg: >-
          Initial support: Debian 13+ and Ubuntu 24.04+. For other
          distributions or releases, fork and adapt package/service/path.
      tags: [always, preflight]
  roles:
    - role: common
      tags: [common, baseline]
    - role: ssh_access
      tags: [ssh_access, ssh, baseline]
    - role: docker
      tags: [docker, baseline]
    - role: tailscale
      tags: [tailscale, baseline]
    - role: ssh_hardening
      tags: [ssh_hardening, ssh, baseline]
    - role: firewall
      tags: [firewall, baseline]
    - role: agent_hub
      tags: [agent_hub]
      when: agent_hub_install | default(false) | bool
